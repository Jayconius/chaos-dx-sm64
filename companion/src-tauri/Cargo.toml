[package]
name = "chaos-companion"
version = "0.1.0"
description = "Twitch chat voting companion for the sm64coopdx Chaos mod"
edition = "2021"

[lib]
name = "chaos_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

# Keep the exe small: optimise for size, strip symbols, single codegen unit.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
